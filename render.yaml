services:
  - type: web
    name: resortbook-api
    runtime: python
    repo: https://github.com/anomalyco/resort-book
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
    autoDeploy: true

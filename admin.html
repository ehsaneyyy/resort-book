<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Coastal Haven Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fdf8f0', 100: '#f5e6d0', 200: '#e8cba0', 300: '#d4a574', 400: '#c9995a', 500: '#b8863e', 600: '#9a6f2f', 700: '#7a5826', 800: '#5c421d', 900: '#3d2c14' },
            dark: { 50: '#e8e8ea', 100: '#c5c5c9', 200: '#9e9ea5', 300: '#767680', 400: '#555562', 500: '#353545', 600: '#2a2a3a', 700: '#1f1f30', 800: '#151525', 900: '#0a0a1a' },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-dark-900 text-slate-200 antialiased">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-dark-900/80 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 lg:h-20">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-9 h-9 bg-gradient-to-br from-brand-400 to-brand-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          </div>
          <span class="text-xl font-bold text-white">Coastal Haven</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition">Home</a>
          <a href="rooms.html" class="text-sm font-medium text-slate-400 hover:text-white transition">Rooms</a>
          <a href="admin.html" class="text-sm font-medium text-brand-400">Admin</a>
          <button onclick="resetData()" class="text-sm font-medium text-slate-400 hover:text-white transition">Reset Demo Data</button>
        </div>
        <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden p-2 text-slate-400 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-dark-800 border-t border-white/5">
      <div class="px-4 py-4 space-y-3">
        <a href="index.html" class="block py-2 text-slate-400 hover:text-white transition">Home</a>
        <a href="rooms.html" class="block py-2 text-slate-400 hover:text-white transition">Rooms</a>
        <a href="admin.html" class="block py-2 text-brand-400 font-medium">Admin</a>
        <button onclick="resetData()" class="block py-2 text-slate-400 hover:text-white transition text-left">Reset Demo Data</button>
      </div>
    </div>
  </nav>

  <main class="pt-24 pb-20 lg:pt-32 lg:pb-28">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold text-white">Dashboard</h1>
          <p class="text-slate-400 mt-1">Manage your bookings and track performance.</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-slate-500" id="last-refresh"></span>
          <button onclick="refreshDashboard()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-sm text-slate-300 rounded-xl transition border border-white/10 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5">
          <p class="text-slate-500 text-sm mb-1">Total Bookings</p>
          <p id="stat-total" class="text-2xl lg:text-3xl font-bold text-white">0</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-emerald-500/10 p-5">
          <p class="text-slate-500 text-sm mb-1">Confirmed</p>
          <p id="stat-confirmed" class="text-2xl lg:text-3xl font-bold text-emerald-400">0</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-yellow-500/10 p-5">
          <p class="text-slate-500 text-sm mb-1">Pending</p>
          <p id="stat-pending" class="text-2xl lg:text-3xl font-bold text-yellow-400">0</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-red-500/10 p-5">
          <p class="text-slate-500 text-sm mb-1">Cancelled</p>
          <p id="stat-cancelled" class="text-2xl lg:text-3xl font-bold text-red-400">0</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-brand-500/10 p-5 col-span-2 lg:col-span-1">
          <p class="text-slate-500 text-sm mb-1">Revenue</p>
          <p id="stat-revenue" class="text-2xl lg:text-3xl font-bold text-brand-400">&#8377;0</p>
        </div>
      </div>

      <div class="flex items-center gap-2 mb-6 overflow-x-auto pb-2">
        <button onclick="filterBookings('all')" data-filter="all" class="px-4 py-2 rounded-xl text-sm font-medium transition bg-white/10 text-white whitespace-nowrap">All Bookings</button>
        <button onclick="filterBookings('Confirmed')" data-filter="Confirmed" class="px-4 py-2 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white whitespace-nowrap">Confirmed</button>
        <button onclick="filterBookings('Pending')" data-filter="Pending" class="px-4 py-2 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white whitespace-nowrap">Pending</button>
        <button onclick="filterBookings('Cancelled')" data-filter="Cancelled" class="px-4 py-2 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white whitespace-nowrap">Cancelled</button>
      </div>

      <div class="bg-dark-800/50 rounded-2xl border border-white/5 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-white/5">
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Guest</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Room</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Check-in</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Check-out</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Duration</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Amount</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                <th class="text-left py-4 px-4 lg:px-6 text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/admin.js"></script>
  <script>
    function refreshDashboard() {
      renderAdminStats();
      renderBookingsTable("all");
      filterBookings("all");
      document.getElementById("last-refresh").textContent = "Last refresh: " + new Date().toLocaleTimeString();
      showToast("Dashboard refreshed", "info");
    }

    function resetData() {
      if (!confirm("This will reset all demo data to the original state. Continue?")) return;
      localStorage.removeItem("resortbook_bookings");
      renderAdminStats();
      renderBookingsTable("all");
      filterBookings("all");
      showToast("Demo data reset successfully", "success");
    }

    renderAdminStats();
    renderBookingsTable("all");
    document.getElementById("last-refresh").textContent = "Last refresh: " + new Date().toLocaleTimeString();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guests - Coastal Haven Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf8f0',100:'#f5e6d0',200:'#e8cba0',300:'#d4a574',400:'#c9995a',500:'#b8863e',600:'#9a6f2f'},dark:{700:'#1f1f30',800:'#151525',900:'#0a0a1a'}}}}}</script>
</head>
<body class="bg-dark-900 text-slate-200 antialiased">
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    initAdminLayout("guests");
    const content = document.getElementById("admin-content");
    let guests = getAdminGuests();
    let searchQuery = "";
    let sortBy = "name";

    function render() {
      let filtered = [...guests];
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(g => g.name.toLowerCase().includes(q) || g.email.toLowerCase().includes(q) || g.phone.includes(q) || g.city.toLowerCase().includes(q));
      }
      if (sortBy === "spent") filtered.sort((a, b) => b.totalSpent - a.totalSpent);
      else if (sortBy === "bookings") filtered.sort((a, b) => b.totalBookings - a.totalBookings);
      else filtered.sort((a, b) => a.name.localeCompare(b.name));

      const vipCount = guests.filter(g => g.vip).length;
      const totalSpent = guests.reduce((s, g) => s + g.totalSpent, 0);

      content.innerHTML = `
        <div class="grid grid-cols-3 gap-4 mb-6">
          <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5">
            <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Total Guests</p>
            <p class="text-3xl font-bold text-white">${guests.length}</p>
          </div>
          <div class="bg-dark-800/50 rounded-2xl border border-brand-500/10 p-5">
            <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">VIP Guests</p>
            <p class="text-3xl font-bold text-amber-400">${vipCount}</p>
          </div>
          <div class="bg-dark-800/50 rounded-2xl border border-emerald-500/10 p-5">
            <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Total Revenue</p>
            <p class="text-3xl font-bold text-emerald-400">${formatCurrency(totalSpent)}</p>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-6">
          <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input oninput="searchQuery=this.value;render()" placeholder="Search by name, email, phone, or city..." class="w-full pl-10 pr-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 placeholder-slate-500">
          </div>
          <select onchange="sortBy=this.value;render()" class="px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="name">Sort by Name</option>
            <option value="spent" ${sortBy==="spent"?"selected":""}>Sort by Revenue</option>
            <option value="bookings" ${sortBy==="bookings"?"selected":""}>Sort by Bookings</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          ${filtered.map(g => `
            <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5 hover:border-brand-500/20 transition">
              <div class="flex items-start gap-4 mb-4">
                <div class="w-12 h-12 ${g.vip?'bg-brand-500/20 border border-brand-500/30':'bg-white/10'} rounded-xl flex items-center justify-center ${g.vip?'text-brand-400':'text-slate-400'} text-lg font-bold flex-shrink-0 relative">
                  ${g.name.charAt(0)}
                  ${g.vip ? '<div class="absolute -top-1 -right-1 w-4 h-4 bg-amber-400 rounded-full flex items-center justify-center"><svg class="w-2.5 h-2.5 text-dark-900" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg></div>' : ""}
                </div>
                <div class="min-w-0">
                  <h3 class="text-white font-semibold truncate">${g.name}</h3>
                  <p class="text-slate-500 text-xs">${g.city} &middot; ${g.email}</p>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                <div class="bg-dark-700/50 rounded-lg p-2"><p class="text-white font-bold">${g.totalBookings}</p><p class="text-[10px] text-slate-500">Bookings</p></div>
                <div class="bg-dark-700/50 rounded-lg p-2"><p class="text-amber-400 font-bold text-sm">${formatCurrency(g.totalSpent)}</p><p class="text-[10px] text-slate-500">Revenue</p></div>
                <div class="bg-dark-700/50 rounded-lg p-2"><p class="text-slate-300 text-sm">${formatDate(g.lastVisit)}</p><p class="text-[10px] text-slate-500">Last Visit</p></div>
              </div>
              ${g.notes ? `<div class="bg-dark-700/30 rounded-lg p-3 mb-3"><p class="text-xs text-slate-400">${g.notes}</p></div>` : ""}
              <div class="flex gap-2">
                <a href="bookings.html" class="flex-1 py-2 bg-white/5 hover:bg-white/10 text-slate-300 text-sm rounded-lg transition text-center">View Bookings</a>
                <button onclick="toggleVip('${g.id}')" class="px-3 py-2 ${g.vip?'bg-brand-500/20 text-brand-400':'bg-white/5 text-slate-400'} hover:bg-brand-500/30 text-sm rounded-lg transition">${g.vip ? '&#9733; VIP' : 'VIP'}</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function toggleVip(id) {
      const g = guests.find(x => x.id === id);
      if (g) {
        g.vip = !g.vip;
        saveAdminData("admin_guests", guests);
        showToast(g.vip ? `${g.name} marked as VIP` : `${g.name} removed from VIP`, "success");
        render();
      }
    }

    render();
  </script>
</body>
</html>

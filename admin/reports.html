<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Coastal Haven Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf8f0',100:'#f5e6d0',200:'#e8cba0',300:'#d4a574',400:'#c9995a',500:'#b8863e',600:'#9a6f2f'},dark:{700:'#1f1f30',800:'#151525',900:'#0a0a1a'}}}}}</script>
</head>
<body class="bg-dark-900 text-slate-200 antialiased">
  <script src="js/admin-data.js"></script>
  <script src="js/admin-layout.js"></script>
  <script>
    initAdminLayout("reports");
    const content = document.getElementById("admin-content");
    const bookings = getAdminBookings();
    const rooms = getAdminRooms();

    const confirmed = bookings.filter(b => b.status === "Confirmed" || b.status === "Checked Out");
    const totalRevenue = confirmed.reduce((s, b) => s + b.total, 0);
    const avgBookingValue = confirmed.length > 0 ? Math.round(totalRevenue / confirmed.length) : 0;
    const totalNights = confirmed.reduce((s, b) => s + b.nights, 0);
    const avgStay = confirmed.length > 0 ? (totalNights / confirmed.length).toFixed(1) : 0;

    const roomTypeRevenue = {};
    confirmed.forEach(b => {
      const room = getRoomById(b.roomId);
      const type = room?.type || "Unknown";
      roomTypeRevenue[type] = (roomTypeRevenue[type] || 0) + b.total;
    });
    const maxTypeRevenue = Math.max(...Object.values(roomTypeRevenue), 1);

    const sourceStats = {};
    confirmed.forEach(b => { sourceStats[b.source] = (sourceStats[b.source] || 0) + 1; });

    const paymentStats = {};
    confirmed.forEach(b => { paymentStats[b.paymentMethod] = (paymentStats[b.paymentMethod] || 0) + b.total; });

    const monthlyData = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setMonth(d.getMonth() - i);
      const month = d.toLocaleString("en-IN", { month: "short" });
      const monthBookings = confirmed.filter(b => {
        const bd = new Date(b.checkIn);
        return bd.getMonth() === d.getMonth() && bd.getFullYear() === d.getFullYear();
      });
      monthlyData.push({ month, revenue: monthBookings.reduce((s, b) => s + b.total, 0), count: monthBookings.length });
    }
    const maxMonthlyRevenue = Math.max(...monthlyData.map(m => m.revenue), 1);

    const topGuests = [...getAdminGuests()].sort((a, b) => b.totalSpent - a.totalSpent).slice(0, 5);

    content.innerHTML = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider mb-2">Total Revenue</p>
          <p class="text-3xl font-bold text-emerald-400">${formatCurrency(totalRevenue)}</p>
          <p class="text-xs text-slate-500 mt-1">From ${confirmed.length} bookings</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider mb-2">Avg Booking Value</p>
          <p class="text-3xl font-bold text-brand-400">${formatCurrency(avgBookingValue)}</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider mb-2">Total Room Nights</p>
          <p class="text-3xl font-bold text-blue-400">${totalNights}</p>
        </div>
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider mb-2">Avg Stay Duration</p>
          <p class="text-3xl font-bold text-white">${avgStay} <span class="text-sm font-normal text-slate-500">nights</span></p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
          <h3 class="text-lg font-semibold text-white mb-6">Revenue by Month</h3>
          <div class="flex items-end gap-3 h-48">
            ${monthlyData.map(m => `
              <div class="flex-1 flex flex-col items-center gap-2">
                <p class="text-xs text-amber-400 font-medium">${m.revenue > 0 ? formatCurrency(m.revenue) : "-"}</p>
                <div class="w-full bg-brand-500/20 rounded-t-lg transition-all" style="height: ${m.revenue > 0 ? Math.max((m.revenue / maxMonthlyRevenue) * 140, 8) : 4}px"></div>
                <p class="text-xs text-slate-500">${m.month}</p>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
          <h3 class="text-lg font-semibold text-white mb-6">Revenue by Room Type</h3>
          <div class="space-y-4">
            ${Object.entries(roomTypeRevenue).sort((a, b) => b[1] - a[1]).map(([type, rev]) => `
              <div>
                <div class="flex justify-between text-sm mb-1">
                  <span class="text-slate-300">${type}</span>
                  <span class="text-amber-400 font-medium">${formatCurrency(rev)}</span>
                </div>
                <div class="w-full h-2 bg-dark-700 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-brand-500 to-brand-400 rounded-full" style="width: ${(rev / maxTypeRevenue) * 100}%"></div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
          <h3 class="text-lg font-semibold text-white mb-4">Booking Sources</h3>
          <div class="space-y-3">
            ${Object.entries(sourceStats).sort((a, b) => b[1] - a[1]).map(([src, count]) => `
              <div class="flex items-center justify-between p-3 bg-dark-700/50 rounded-xl">
                <span class="text-sm text-slate-300">${src}</span>
                <span class="text-sm font-medium text-white">${count} bookings</span>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
          <h3 class="text-lg font-semibold text-white mb-4">Payment Methods</h3>
          <div class="space-y-3">
            ${Object.entries(paymentStats).sort((a, b) => b[1] - a[1]).map(([method, rev]) => `
              <div class="flex items-center justify-between p-3 bg-dark-700/50 rounded-xl">
                <span class="text-sm text-slate-300">${method}</span>
                <span class="text-sm font-medium text-amber-400">${formatCurrency(rev)}</span>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
          <h3 class="text-lg font-semibold text-white mb-4">Top Guests</h3>
          <div class="space-y-3">
            ${topGuests.map((g, i) => `
              <div class="flex items-center gap-3 p-3 bg-dark-700/50 rounded-xl">
                <span class="text-sm font-bold text-slate-500 w-5">#${i + 1}</span>
                <div class="w-8 h-8 ${g.vip?'bg-brand-500/20 text-brand-400':'bg-white/10 text-slate-400'} rounded-lg flex items-center justify-center text-xs font-bold">${g.name.charAt(0)}</div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm text-white truncate">${g.name}</p>
                  <p class="text-[10px] text-slate-500">${g.totalBookings} bookings</p>
                </div>
                <span class="text-sm font-medium text-amber-400">${formatCurrency(g.totalSpent)}</span>
              </div>
            `).join("")}
          </div>
        </div>
      </div>

      <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
        <h3 class="text-lg font-semibold text-white mb-4">Room Performance</h3>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-white/5">
                <th class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase">Room</th>
                <th class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase">Type</th>
                <th class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase">Bookings</th>
                <th class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase">Revenue</th>
                <th class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase">Avg Stay</th>
              </tr>
            </thead>
            <tbody>
              ${rooms.map(r => {
                const rb = confirmed.filter(b => b.roomId === r.id);
                const rev = rb.reduce((s, b) => s + b.total, 0);
                const avgNights = rb.length > 0 ? (rb.reduce((s, b) => s + b.nights, 0) / rb.length).toFixed(1) : "0";
                return `
                  <tr class="border-b border-white/5 hover:bg-white/[0.02]">
                    <td class="py-3 px-4 text-sm text-white font-medium">${r.name}</td>
                    <td class="py-3 px-4 text-sm text-slate-400">${r.type}</td>
                    <td class="py-3 px-4 text-sm text-slate-300">${rb.length}</td>
                    <td class="py-3 px-4 text-sm text-amber-400 font-medium">${formatCurrency(rev)}</td>
                    <td class="py-3 px-4 text-sm text-slate-300">${avgNights}N</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `;
  </script>
</body>
</html>

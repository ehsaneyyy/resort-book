<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms - Coastal Haven Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf8f0',100:'#f5e6d0',200:'#e8cba0',300:'#d4a574',400:'#c9995a',500:'#b8863e',600:'#9a6f2f'},dark:{700:'#1f1f30',800:'#151525',900:'#0a0a1a'}}}}}</script>
</head>
<body class="bg-dark-900 text-slate-200 antialiased">
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    initAdminLayout("rooms");
    const content = document.getElementById("admin-content");
    let rooms = getAdminRooms();
    let filterType = "all";

    function render() {
      const filtered = filterType === "all" ? rooms : rooms.filter(r => r.type === filterType);
      const types = [...new Set(rooms.map(r => r.type))];
      const occupied = getAdminBookings().filter(b => b.status === "Confirmed" && today() >= b.checkIn && today() < b.checkOut).map(b => b.roomId);

      content.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <p class="text-slate-400 text-sm">${rooms.length} total rooms &middot; ${occupied.length} occupied &middot; ${rooms.length - occupied.length} available</p>
          </div>
          <button onclick="openAddRoom()" class="px-5 py-2.5 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-brand-500/25">+ Add Room</button>
        </div>

        <div class="flex flex-wrap gap-2 mb-6">
          <button onclick="setFilter('all')" class="px-4 py-2 rounded-xl text-sm font-medium transition ${filterType==='all'?'bg-white/10 text-white border border-white/10':'text-slate-400 hover:text-white border border-transparent'}">All</button>
          ${types.map(t => `<button onclick="setFilter('${t}')" class="px-4 py-2 rounded-xl text-sm font-medium transition ${filterType===t?'bg-white/10 text-white border border-white/10':'text-slate-400 hover:text-white border border-transparent'}">${t}</button>`).join("")}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          ${filtered.map(r => {
            const isOccupied = occupied.includes(r.id);
            return `
              <div class="bg-dark-800/50 rounded-2xl border border-white/5 overflow-hidden hover:border-brand-500/20 transition group">
                <div class="relative h-44 overflow-hidden">
                  <img src="${r.image}" alt="${r.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                  <div class="absolute top-3 left-3 flex gap-2">
                    <span class="px-2.5 py-1 bg-dark-900/80 backdrop-blur-sm rounded-lg text-xs font-medium text-brand-400 border border-brand-500/20">${r.type}</span>
                    <span class="px-2.5 py-1 ${isOccupied?'bg-red-500/20 text-red-400 border-red-500/20':'bg-emerald-500/20 text-emerald-400 border-emerald-500/20'} backdrop-blur-sm rounded-lg text-xs font-medium border">${isOccupied?'Occupied':'Available'}</span>
                  </div>
                  <div class="absolute top-3 right-3 px-2.5 py-1 bg-dark-900/80 backdrop-blur-sm rounded-lg text-xs text-slate-300 border border-white/10">Floor ${r.floor}</div>
                </div>
                <div class="p-5">
                  <div class="flex items-start justify-between mb-3">
                    <div>
                      <h3 class="text-white font-semibold">${r.name}</h3>
                      <p class="text-slate-500 text-xs">${r.id} &middot; ${r.beds} &middot; ${r.size} sq ft</p>
                    </div>
                    <div class="text-right">
                      <p class="text-brand-400 font-bold">${formatCurrency(r.price)}</p>
                      <p class="text-slate-500 text-[10px]">/night</p>
                    </div>
                  </div>
                  <div class="flex flex-wrap gap-1 mb-4">
                    ${r.amenities.slice(0, 4).map(a => `<span class="px-2 py-0.5 bg-white/5 rounded text-[10px] text-slate-400">${a}</span>`).join("")}
                    ${r.amenities.length > 4 ? `<span class="px-2 py-0.5 bg-white/5 rounded text-[10px] text-slate-500">+${r.amenities.length - 4}</span>` : ""}
                  </div>
                  <div class="flex gap-2 pt-3 border-t border-white/5">
                    <button onclick="openEditRoom('${r.id}')" class="flex-1 py-2 bg-white/5 hover:bg-white/10 text-slate-300 text-sm rounded-lg transition">Edit</button>
                    <button onclick="deleteRoom('${r.id}')" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm rounded-lg transition">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>

        <div id="room-modal" class="fixed inset-0 z-50 hidden">
          <div class="absolute inset-0 bg-dark-900/80 backdrop-blur-sm" onclick="closeModal()"></div>
          <div class="absolute inset-4 sm:inset-8 lg:inset-y-8 lg:left-1/2 lg:-translate-x-1/2 lg:w-full lg:max-w-2xl bg-dark-800 rounded-2xl border border-white/10 overflow-y-auto">
            <div class="sticky top-0 bg-dark-800 border-b border-white/5 px-6 py-4 flex items-center justify-between z-10">
              <h3 id="modal-title" class="text-lg font-semibold text-white">Add Room</h3>
              <button onclick="closeModal()" class="p-2 hover:bg-white/10 rounded-lg transition text-slate-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div id="modal-body" class="p-6"></div>
          </div>
        </div>
      `;
    }

    function setFilter(type) { filterType = type; render(); }

    function openAddRoom() {
      document.getElementById("modal-title").textContent = "Add Room";
      document.getElementById("modal-body").innerHTML = getRoomForm();
      document.getElementById("room-modal").classList.remove("hidden");
    }

    function openEditRoom(id) {
      const r = getRoomById(id);
      document.getElementById("modal-title").textContent = "Edit Room";
      document.getElementById("modal-body").innerHTML = getRoomForm(r);
      document.getElementById("room-modal").classList.remove("hidden");
    }

    function closeModal() { document.getElementById("room-modal").classList.add("hidden"); }

    function getRoomForm(room) {
      return `
        <form onsubmit="saveRoom(event, '${room ? room.id : ''}')" class="space-y-5">
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm text-slate-300 mb-1">Room Name *</label><input required value="${room?.name||''}" id="f-name" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
            <div><label class="block text-sm text-slate-300 mb-1">Type *</label><select required id="f-type" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"><option ${room?.type==='Standard'?'selected':''}>Standard</option><option ${room?.type==='Deluxe'?'selected':''}>Deluxe</option><option ${room?.type==='Suite'?'selected':''}>Suite</option><option ${room?.type==='Premium Suite'?'selected':''}>Premium Suite</option><option ${room?.type==='Villa'?'selected':''}>Villa</option></select></div>
          </div>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="block text-sm text-slate-300 mb-1">Weekday Price *</label><input required type="number" value="${room?.price||''}" id="f-price" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
            <div><label class="block text-sm text-slate-300 mb-1">Weekend Price *</label><input required type="number" value="${room?.weekendPrice||''}" id="f-weekend" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
            <div><label class="block text-sm text-slate-300 mb-1">Capacity *</label><input required type="number" value="${room?.capacity||''}" id="f-capacity" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
          </div>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="block text-sm text-slate-300 mb-1">Beds *</label><input required value="${room?.beds||''}" id="f-beds" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
            <div><label class="block text-sm text-slate-300 mb-1">Size (sq ft) *</label><input required type="number" value="${room?.size||''}" id="f-size" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
            <div><label class="block text-sm text-slate-300 mb-1">Floor *</label><input required type="number" value="${room?.floor??''}" id="f-floor" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
          </div>
          <div><label class="block text-sm text-slate-300 mb-1">Image URL</label><input value="${room?.image||''}" id="f-image" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="https://..."></div>
          <div><label class="block text-sm text-slate-300 mb-1">Description</label><textarea rows="3" id="f-desc" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none">${room?.description||''}</textarea></div>
          <div><label class="block text-sm text-slate-300 mb-1">Amenities (comma separated)</label><input value="${room?.amenities?.join(', ')||''}" id="f-amenities" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="AC, WiFi, TV..."></div>
          <div class="flex gap-3 pt-4">
            <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-white font-semibold rounded-xl transition">${room ? 'Update Room' : 'Add Room'}</button>
            <button type="button" onclick="closeModal()" class="px-6 py-3 bg-white/5 hover:bg-white/10 text-slate-300 font-semibold rounded-xl transition">Cancel</button>
          </div>
        </form>
      `;
    }

    function saveRoom(e, existingId) {
      e.preventDefault();
      const data = {
        name: document.getElementById("f-name").value,
        type: document.getElementById("f-type").value,
        price: parseInt(document.getElementById("f-price").value),
        weekendPrice: parseInt(document.getElementById("f-weekend").value),
        capacity: parseInt(document.getElementById("f-capacity").value),
        beds: document.getElementById("f-beds").value,
        size: parseInt(document.getElementById("f-size").value),
        floor: parseInt(document.getElementById("f-floor").value),
        image: document.getElementById("f-image").value || "https://images.unsplash.com/photo-1631049307038-da31ec3d517c?w=400&h=300&fit=crop",
        description: document.getElementById("f-desc").value,
        amenities: document.getElementById("f-amenities").value.split(",").map(a => a.trim()).filter(Boolean),
      };

      if (existingId) {
        const idx = rooms.findIndex(r => r.id === existingId);
        if (idx >= 0) rooms[idx] = { ...rooms[idx], ...data };
        showToast("Room updated successfully", "success");
      } else {
        data.id = "RM" + String(rooms.length + 1).padStart(3, "0");
        data.status = "available";
        rooms.push(data);
        showToast("Room added successfully", "success");
      }

      saveAdminData("admin_rooms", rooms);
      closeModal();
      render();
    }

    function deleteRoom(id) {
      if (!confirm("Are you sure you want to delete this room?")) return;
      rooms = rooms.filter(r => r.id !== id);
      saveAdminData("admin_rooms", rooms);
      showToast("Room deleted", "info");
      render();
    }

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Coastal Haven Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf8f0',100:'#f5e6d0',200:'#e8cba0',300:'#d4a574',400:'#c9995a',500:'#b8863e',600:'#9a6f2f'},dark:{700:'#1f1f30',800:'#151525',900:'#0a0a1a'}}}}}</script>
</head>
<body class="bg-dark-900 text-slate-200 antialiased">
  <script src="js/admin-data.js"></script>
  <script src="js/admin-layout.js"></script>
  <script>
    initAdminLayout("settings");
    const content = document.getElementById("admin-content");
    let resort = getResortSettings();

    function render() {
      content.innerHTML = `
        <div class="max-w-3xl space-y-6">
          <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
            <h3 class="text-lg font-semibold text-white mb-6">Resort Information</h3>
            <form onsubmit="saveResortInfo(event)" class="space-y-5">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div><label class="block text-sm text-slate-300 mb-1">Resort Name</label><input value="${resort.name}" id="s-name" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
                <div><label class="block text-sm text-slate-300 mb-1">Tagline</label><input value="${resort.tagline}" id="s-tagline" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div><label class="block text-sm text-slate-300 mb-1">Phone</label><input value="${resort.phone}" id="s-phone" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
                <div><label class="block text-sm text-slate-300 mb-1">Email</label><input value="${resort.email}" id="s-email" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
              </div>
              <div><label class="block text-sm text-slate-300 mb-1">Address</label><input value="${resort.address}" id="s-address" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
              <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-brand-500/25">Save Changes</button>
            </form>
          </div>

          <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
            <h3 class="text-lg font-semibold text-white mb-6">Booking Policies</h3>
            <form onsubmit="savePolicies(event)" class="space-y-5">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div><label class="block text-sm text-slate-300 mb-1">Check-in Time</label><input type="time" value="${resort.checkInTime}" id="s-checkin" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
                <div><label class="block text-sm text-slate-300 mb-1">Check-out Time</label><input type="time" value="${resort.checkOutTime}" id="s-checkout" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
              </div>
              <div><label class="block text-sm text-slate-300 mb-1">Tax Rate (%)</label><input type="number" step="0.5" value="${resort.taxRate}" id="s-tax" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 max-w-xs"></div>
              <div><label class="block text-sm text-slate-300 mb-1">Cancellation Policy</label><textarea rows="3" id="s-cancellation" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none">Free cancellation up to 48 hours before check-in. No-shows will be charged full amount.</textarea></div>
              <div><label class="block text-sm text-slate-300 mb-1">House Rules</label><textarea rows="3" id="s-rules" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none">Valid government ID required at check-in. Quiet hours: 10 PM - 7 AM. No smoking in rooms. Pets allowed in select villas only.</textarea></div>
              <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-brand-500/25">Save Policies</button>
            </form>
          </div>

          <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
            <h3 class="text-lg font-semibold text-white mb-6">System</h3>
            <div class="space-y-4">
              <div class="flex items-center justify-between p-4 bg-dark-700/50 rounded-xl">
                <div>
                  <p class="text-white font-medium">Total Rooms</p>
                  <p class="text-sm text-slate-500">${getAdminRooms().length} rooms configured</p>
                </div>
                <a href="rooms.html" class="text-sm text-brand-400 hover:text-brand-300 transition">Manage</a>
              </div>
              <div class="flex items-center justify-between p-4 bg-dark-700/50 rounded-xl">
                <div>
                  <p class="text-white font-medium">Total Bookings</p>
                  <p class="text-sm text-slate-500">${getAdminBookings().length} bookings in system</p>
                </div>
                <a href="bookings.html" class="text-sm text-brand-400 hover:text-brand-300 transition">View</a>
              </div>
              <div class="flex items-center justify-between p-4 bg-dark-700/50 rounded-xl">
                <div>
                  <p class="text-white font-medium">Total Guests</p>
                  <p class="text-sm text-slate-500">${getAdminGuests().length} guest profiles</p>
                </div>
                <a href="guests.html" class="text-sm text-brand-400 hover:text-brand-300 transition">View</a>
              </div>
              <div class="border-t border-white/5 pt-4 mt-4">
                <h4 class="text-white font-medium mb-3">Danger Zone</h4>
                <div class="flex flex-col sm:flex-row gap-3">
                  <button onclick="resetAllData()" class="px-5 py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm font-medium rounded-xl transition border border-red-500/20">Reset All Demo Data</button>
                  <button onclick="exportData()" class="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-slate-300 text-sm font-medium rounded-xl transition border border-white/10">Export Data (JSON)</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function saveResortInfo(e) {
      e.preventDefault();
      resort.name = document.getElementById("s-name").value;
      resort.tagline = document.getElementById("s-tagline").value;
      resort.phone = document.getElementById("s-phone").value;
      resort.email = document.getElementById("s-email").value;
      resort.address = document.getElementById("s-address").value;
      saveAdminData("resort_settings", resort);
      showToast("Resort info updated", "success");
    }

    function savePolicies(e) {
      e.preventDefault();
      resort.checkInTime = document.getElementById("s-checkin").value;
      resort.checkOutTime = document.getElementById("s-checkout").value;
      resort.taxRate = parseFloat(document.getElementById("s-tax").value);
      saveAdminData("resort_settings", resort);
      showToast("Policies updated", "success");
    }

    function resetAllData() {
      if (!confirm("This will reset ALL data to demo defaults. This cannot be undone.")) return;
      localStorage.removeItem("resortbook_admin_bookings");
      localStorage.removeItem("resortbook_admin_rooms");
      localStorage.removeItem("resortbook_admin_guests");
      localStorage.removeItem("resortbook_resort_settings");
      localStorage.removeItem("resortbook_seasonal_pricing");
      localStorage.removeItem("resortbook_bookings");
      showToast("All data reset to defaults", "success");
      setTimeout(() => location.reload(), 1000);
    }

    function exportData() {
      const data = {
        exportDate: new Date().toISOString(),
        resort: getResortSettings(),
        rooms: getAdminRooms(),
        bookings: getAdminBookings(),
        guests: getAdminGuests(),
        seasonalPricing: getSeasonalPricing(),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `coastal-haven-export-${today()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Data exported successfully", "success");
    }

    render();
  </script>
</body>
</html>

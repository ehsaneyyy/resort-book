<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing - Coastal Haven Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf8f0',100:'#f5e6d0',200:'#e8cba0',300:'#d4a574',400:'#c9995a',500:'#b8863e',600:'#9a6f2f'},dark:{700:'#1f1f30',800:'#151525',900:'#0a0a1a'}}}}}</script>
</head>
<body class="bg-dark-900 text-slate-200 antialiased">
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    initAdminLayout("pricing");
    const content = document.getElementById("admin-content");
    const rooms = getAdminRooms();
    let seasonal = getSeasonalPricing();

    function render() {
      content.innerHTML = `
        <div class="mb-8">
          <h2 class="text-xl font-semibold text-white mb-4">Room Pricing</h2>
          <div class="bg-dark-800/50 rounded-2xl border border-white/5 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="border-b border-white/5">
                    <th class="text-left py-3 px-5 text-xs font-medium text-slate-500 uppercase">Room</th>
                    <th class="text-left py-3 px-5 text-xs font-medium text-slate-500 uppercase">Type</th>
                    <th class="text-left py-3 px-5 text-xs font-medium text-slate-500 uppercase">Weekday Rate</th>
                    <th class="text-left py-3 px-5 text-xs font-medium text-slate-500 uppercase">Weekend Rate</th>
                    <th class="text-left py-3 px-5 text-xs font-medium text-slate-500 uppercase">Capacity</th>
                    <th class="text-left py-3 px-5 text-xs font-medium text-slate-500 uppercase">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${rooms.map(r => `
                    <tr class="border-b border-white/5 hover:bg-white/[0.02]">
                      <td class="py-3 px-5 text-sm text-white font-medium">${r.name}</td>
                      <td class="py-3 px-5 text-sm text-slate-400">${r.type}</td>
                      <td class="py-3 px-5 text-sm text-amber-400 font-medium">${formatCurrency(r.price)}</td>
                      <td class="py-3 px-5 text-sm text-amber-400 font-medium">${formatCurrency(r.weekendPrice)}</td>
                      <td class="py-3 px-5 text-sm text-slate-300">${r.capacity} guests</td>
                      <td class="py-3 px-5">
                        <button onclick="editRoomPricing('${r.id}')" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-slate-300 text-xs rounded-lg transition">Edit Rates</button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="mb-8">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold text-white">Seasonal Pricing Rules</h2>
            <button onclick="addSeason()" class="px-4 py-2 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-brand-500/25">+ Add Rule</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${seasonal.map(s => `
              <div class="bg-dark-800/50 rounded-2xl border ${s.active?'border-brand-500/20':'border-white/5'} p-5">
                <div class="flex items-start justify-between mb-3">
                  <div>
                    <h3 class="text-white font-semibold">${s.name}</h3>
                    <p class="text-slate-500 text-xs mt-1">${s.multiplier > 1 ? "+" : ""}${Math.round((s.multiplier - 1) * 100)}% ${s.multiplier > 1 ? "surcharge" : "discount"}</p>
                  </div>
                  <button onclick="toggleSeason('${s.id}')" class="relative w-10 h-5 rounded-full transition ${s.active ? 'bg-brand-500' : 'bg-slate-600'}">
                    <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition transform ${s.active ? 'translate-x-5' : ''}"></span>
                  </button>
                </div>
                <div class="flex flex-wrap gap-1.5 mb-3">
                  ${(s.months || s.days || []).map(t => `<span class="px-2 py-0.5 bg-white/5 rounded text-xs text-slate-400">${t}</span>`).join("")}
                </div>
                <div class="flex gap-2 pt-3 border-t border-white/5">
                  <button onclick="editSeason('${s.id}')" class="flex-1 py-2 bg-white/5 hover:bg-white/10 text-slate-300 text-sm rounded-lg transition">Edit</button>
                  <button onclick="deleteSeason('${s.id}')" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm rounded-lg transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="bg-dark-800/50 rounded-2xl border border-white/5 p-6">
          <h2 class="text-xl font-semibold text-white mb-4">Pricing Summary</h2>
          <p class="text-slate-400 text-sm mb-6">Effective rates after applying all seasonal rules</p>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${rooms.map(r => {
              const activeSeasons = seasonal.filter(s => s.active);
              let effectiveWeekday = r.price;
              let effectiveWeekend = r.weekendPrice;
              activeSeasons.forEach(s => {
                if (s.days) { /* weekend rule handled separately */ }
                else if (s.months) {
                  const currentMonth = new Date().toLocaleString("en-IN", { month: "short" });
                  if (s.months.includes(currentMonth)) {
                    effectiveWeekday = Math.round(effectiveWeekday * s.multiplier);
                    effectiveWeekend = Math.round(effectiveWeekend * s.multiplier);
                  }
                }
              });
              return `
                <div class="bg-dark-700/50 rounded-xl p-4 border border-white/5">
                  <h4 class="text-white font-medium mb-2">${r.name}</h4>
                  <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Weekday:</span>
                    <span class="text-amber-400 font-medium">${formatCurrency(effectiveWeekday)}</span>
                  </div>
                  <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Weekend:</span>
                    <span class="text-amber-400 font-medium">${formatCurrency(effectiveWeekend)}</span>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>

        <div id="pricing-modal" class="fixed inset-0 z-50 hidden">
          <div class="absolute inset-0 bg-dark-900/80 backdrop-blur-sm" onclick="closePricingModal()"></div>
          <div class="absolute inset-4 sm:inset-8 lg:inset-y-8 lg:left-1/2 lg:-translate-x-1/2 lg:w-full lg:max-w-md bg-dark-800 rounded-2xl border border-white/10 overflow-y-auto">
            <div class="sticky top-0 bg-dark-800 border-b border-white/5 px-6 py-4 flex items-center justify-between z-10">
              <h3 id="pricing-modal-title" class="text-lg font-semibold text-white">Edit</h3>
              <button onclick="closePricingModal()" class="p-2 hover:bg-white/10 rounded-lg transition text-slate-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div id="pricing-modal-body" class="p-6"></div>
          </div>
        </div>
      `;
    }

    function editRoomPricing(roomId) {
      const r = getRoomById(roomId);
      document.getElementById("pricing-modal-title").textContent = "Edit Pricing: " + r.name;
      document.getElementById("pricing-modal-body").innerHTML = `
        <form onsubmit="saveRoomPricing(event, '${roomId}')" class="space-y-5">
          <div><label class="block text-sm text-slate-300 mb-1">Weekday Rate (₹)</label><input type="number" value="${r.price}" id="ep-weekday" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
          <div><label class="block text-sm text-slate-300 mb-1">Weekend Rate (₹)</label><input type="number" value="${r.weekendPrice}" id="ep-weekend" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
          <div class="flex gap-3"><button type="submit" class="flex-1 py-3 bg-gradient-to-r from-brand-500 to-brand-600 text-white font-semibold rounded-xl transition">Save Changes</button><button type="button" onclick="closePricingModal()" class="px-6 py-3 bg-white/5 text-slate-300 rounded-xl transition">Cancel</button></div>
        </form>
      `;
      document.getElementById("pricing-modal").classList.remove("hidden");
    }

    function saveRoomPricing(e, roomId) {
      e.preventDefault();
      const r = rooms.find(x => x.id === roomId);
      if (r) {
        r.price = parseInt(document.getElementById("ep-weekday").value);
        r.weekendPrice = parseInt(document.getElementById("ep-weekend").value);
        saveAdminData("admin_rooms", rooms);
        showToast("Pricing updated", "success");
        closePricingModal();
        render();
      }
    }

    function addSeason() {
      document.getElementById("pricing-modal-title").textContent = "Add Seasonal Rule";
      document.getElementById("pricing-modal-body").innerHTML = `
        <form onsubmit="saveSeason(event)" class="space-y-5">
          <div><label class="block text-sm text-slate-300 mb-1">Rule Name *</label><input required id="ss-name" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="Peak Season"></div>
          <div><label class="block text-sm text-slate-300 mb-1">Multiplier (1.0 = no change, 1.5 = +50%, 0.8 = -20%) *</label><input required type="number" step="0.1" min="0.1" max="3" value="1.0" id="ss-mult" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
          <div><label class="block text-sm text-slate-300 mb-1">Apply To (comma separated) *</label><input required id="ss-apply" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="Jan, Feb, Mar"></div>
          <div><label class="block text-sm text-slate-300 mb-1">Type *</label><select id="ss-type" class="w-full px-4 py-2.5 bg-dark-700 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"><option value="months">Months</option><option value="days">Days of Week</option></select></div>
          <div class="flex gap-3"><button type="submit" class="flex-1 py-3 bg-gradient-to-r from-brand-500 to-brand-600 text-white font-semibold rounded-xl transition">Add Rule</button><button type="button" onclick="closePricingModal()" class="px-6 py-3 bg-white/5 text-slate-300 rounded-xl transition">Cancel</button></div>
        </form>
      `;
      document.getElementById("pricing-modal").classList.remove("hidden");
    }

    function saveSeason(e) {
      e.preventDefault();
      const name = document.getElementById("ss-name").value;
      const multiplier = parseFloat(document.getElementById("ss-mult").value);
      const applyTo = document.getElementById("ss-apply").value.split(",").map(s => s.trim());
      const type = document.getElementById("ss-type").value;
      const rule = { id: "SP" + Date.now(), name, multiplier, active: true };
      if (type === "months") rule.months = applyTo; else rule.days = applyTo;
      seasonal.push(rule);
      saveAdminData("seasonal_pricing", seasonal);
      showToast("Seasonal rule added", "success");
      closePricingModal();
      render();
    }

    function toggleSeason(id) {
      const s = seasonal.find(x => x.id === id);
      if (s) { s.active = !s.active; saveAdminData("seasonal_pricing", seasonal); render(); }
    }

    function editSeason(id) { showToast("Edit modal coming soon", "info"); }
    function deleteSeason(id) {
      if (!confirm("Delete this seasonal rule?")) return;
      seasonal = seasonal.filter(s => s.id !== id);
      saveAdminData("seasonal_pricing", seasonal);
      showToast("Rule deleted", "info");
      render();
    }

    function closePricingModal() { document.getElementById("pricing-modal").classList.add("hidden"); }

    render();
  </script>
</body>
</html>
